<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uncrop</title>
<meta name="description" content="Post the whole photo on Instagram. Uncrop adds the thinnest possible strip so nothing gets cut.">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D111A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Uncrop">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#131926; --muted:#586379; --line:#D8DDE7;
  --accent:#2B4DDB; --accent-ink:#FFFFFF; --accent-soft:#E6EBFD;
  --warn:#A8460A; --warn-bg:#FDEFE2; --ok:#0A6B44; --ok-bg:#E3F3EA;
  --check-a:#E6E9F0; --check-b:#F7F8FB; --ring:#AEB6C4;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, "Roboto Mono", monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0D111A; --surface:#161C27; --ink:#E7EBF3; --muted:#9AA4B7; --line:#283043;
  --accent:#8099FF; --accent-ink:#0D111A; --accent-soft:#1E2846;
  --warn:#F5A866; --warn-bg:#382413; --ok:#62D59D; --ok-bg:#11301F;
  --check-a:#1A202C; --check-b:#212836; --ring:#7E889B; color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D111A; --surface:#161C27; --ink:#E7EBF3; --muted:#9AA4B7; --line:#283043;
  --accent:#8099FF; --accent-ink:#0D111A; --accent-soft:#1E2846;
  --warn:#F5A866; --warn-bg:#382413; --ok:#62D59D; --ok-bg:#11301F;
  --check-a:#1A202C; --check-b:#212836; --ring:#7E889B; color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
[hidden]{display:none!important}
button,select{font:inherit;color:inherit}
.vh{position:fixed;left:0;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}

/* App shell: header / scrolling content / bottom action bar */
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(var(--top) + 10px) 16px 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand img{width:32px;height:32px;border-radius:8px}
.tools{display:flex;gap:8px;align-items:center}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;min-height:40px}
.lang{position:relative;display:flex;align-items:center}
.lang select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 30px 8px 34px;font-size:14px;font-weight:600;min-height:40px;cursor:pointer}
.lang svg{position:absolute;pointer-events:none;color:var(--muted)}
.lang .globe{left:10px}.lang .chev{right:10px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px;display:flex;flex-direction:column;gap:18px}

/* Welcome */
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding-block:16px}
.empty h1{font-size:30px;line-height:1.12;letter-spacing:-.02em;margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:44ch}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;align-items:center;gap:12px;font-weight:600}
.steps b{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:14px}
.big{width:100%;border:0;border-radius:14px;padding:17px;font-size:17px;font-weight:650;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:56px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:10px;cursor:pointer}
.privacy{font-size:13px;color:var(--muted);text-align:center;margin:0}

/* Preview */
.stage{border-radius:14px;padding:14px;display:grid;place-items:center;min-height:240px;
  background-color:var(--check-b);
  background-image:linear-gradient(45deg,var(--check-a) 25%,transparent 25%,transparent 75%,var(--check-a) 75%),linear-gradient(45deg,var(--check-a) 25%,transparent 25%,transparent 75%,var(--check-a) 75%);
  background-size:18px 18px;background-position:0 0,9px 9px}
#preview{max-width:100%;max-height:46vh;width:auto;height:auto;display:block;border-radius:2px;box-shadow:0 6px 22px rgb(0 0 0 / .2)}
.verdict{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 14px;background:var(--ok-bg);color:var(--ok);font-weight:600;font-size:15px}
.verdict svg{flex:0 0 22px;margin-top:1px}
.verdict small{display:block;font-weight:400;color:var(--muted);font-family:var(--mono);font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums}
.removeRow{display:flex;justify-content:flex-end;margin-top:-8px}
.removeRow button{background:none;border:0;color:var(--muted);font-size:14px;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* File strip */
.lbl{font-size:12px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.group{display:flex;flex-direction:column;gap:10px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.thumb{position:relative;flex:0 0 74px;height:74px;border-radius:12px;overflow:hidden;border:3px solid transparent;padding:0;background:var(--surface);cursor:pointer}
.thumb.sel{border-color:var(--accent)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .badge{position:absolute;left:4px;bottom:4px;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:rgb(0 0 0 / .62);color:#fff}
.thumb .badge.done{background:#0A6B44}.thumb .badge.err{background:#A8460A}
.thumb .play{position:absolute;right:4px;top:4px;font-size:10px;color:#fff;background:rgb(0 0 0 / .55);border-radius:4px;padding:0 4px}
.add{flex:0 0 74px;height:74px;border-radius:12px;border:2px dashed var(--line);background:none;color:var(--muted);font-size:28px;cursor:pointer}

/* Choices */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.2;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:48px}
.seg label small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.seg input:checked + label{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.seg input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
/* Strip color: three equal tiles in one row */
.colors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.colors label{flex-direction:column;justify-content:center;gap:8px;text-align:center;padding:12px 6px;min-height:84px;min-width:0;overflow-wrap:anywhere}
.seg input:disabled + label{opacity:.45;cursor:not-allowed}
.sw{flex:0 0 auto;width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 1.5px var(--ring)}
.sw.white{background:#fff}.sw.black{background:#000}
.sw.auto{background:linear-gradient(135deg,#fff 50%,#000 50%)}
.sw.ai{background:conic-gradient(from 200deg,#f0846b,#f9d29d,#86c5a8,#5b7bd5,#b07ad9,#f0846b);display:grid;place-items:center;color:#fff;font-size:14px;font-style:normal;text-shadow:0 1px 2px rgb(0 0 0 / .4)}
.sheet .row2{display:flex;gap:8px}.sheet .row2 button{flex:1}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:20px;color:var(--muted)}
details[open] summary::after{content:"−"}
details .inner{padding:0 16px 16px;display:flex;flex-direction:column;gap:16px}
.note{font-size:13px;color:var(--muted);margin:0}

/* After saving: Instagram tip */
.tip{border-radius:12px;padding:14px 16px;background:var(--accent-soft);display:flex;flex-direction:column;gap:4px}
.tip b{font-size:15px}.tip span{font-size:14px;color:var(--muted)}

/* Bottom bar */
.bottom{padding:12px 16px calc(var(--bot) + 12px);background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.status{font-size:14px;color:var(--muted);min-height:1.2em;text-align:center}
.status.err{color:var(--warn)}
.btns{display:flex;gap:8px}
.btns button{flex:1}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;min-height:56px}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Home Screen sheet (iPhone) */
.sheet{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet > div{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 20px calc(var(--bot) + 20px);display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:20px}
.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion: reduce){.progress i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><img src="icons/icon-192.png" alt="">Uncrop</div>
    <div class="tools">
      <label class="lang">
        <svg class="globe" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
        <select id="langSel" data-i18n-aria="language"></select>
        <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </label>
      <button class="pillbtn" id="installBtn" data-i18n="install" hidden>Install</button>
    </div>
  </header>

  <main id="main">
    <!-- Welcome -->
    <section class="empty" id="empty">
      <h1 data-i18n="h1">Post the whole photo. Nothing cut off.</h1>
      <p data-i18n="intro"></p>
      <ol class="steps">
        <li><b>1</b><span data-i18n="step1"></span></li>
        <li><b>2</b><span data-i18n="step2"></span></li>
        <li><b>3</b><span data-i18n="step3"></span></li>
      </ol>
      <button class="big" id="pickFirst" data-i18n="choose"></button>
      <button class="link" id="tryDemo" data-i18n="try_example"></button>
      <p class="privacy" data-i18n="privacy"></p>
    </section>

    <!-- Workspace -->
    <section id="work" hidden style="display:flex;flex-direction:column;gap:18px">
      <div class="stage"><canvas id="preview" width="400" height="500" data-i18n-aria="preview_label"></canvas></div>
      <div class="removeRow"><button id="removeBtn" data-i18n="remove"></button></div>

      <div class="group">
        <div class="lbl" id="queueLbl"></div>
        <div class="strip" id="strip"></div>
      </div>

      <div class="group">
        <div class="lbl" data-i18n="color"></div>
        <div class="seg colors">
          <input type="radio" name="bg" id="bg-ai" value="ai"><label for="bg-ai"><i class="sw ai">✦</i><span data-i18n="ai"></span></label>
          <input type="radio" name="bg" id="bg-auto" value="auto" checked><label for="bg-auto"><i class="sw auto"></i><span data-i18n="auto"></span></label>
          <input type="radio" name="bg" id="bg-white" value="white"><label for="bg-white"><i class="sw white"></i><span data-i18n="white"></span></label>
          <input type="radio" name="bg" id="bg-black" value="black"><label for="bg-black"><i class="sw black"></i><span data-i18n="black"></span></label>
        </div>
        <p class="note" id="autoHint"></p>
        <p class="note" id="aiNote" data-i18n="ai_unavailable" hidden></p>
      </div>

      <p class="note" id="videoNote" data-i18n="video_note" hidden></p>

      <details>
        <summary data-i18n="more"></summary>
        <div class="inner">
          <div class="group">
            <div class="lbl" data-i18n="size"></div>
            <div class="seg">
              <input type="radio" name="res" id="res-orig" value="orig" checked><label for="res-orig"><span><span data-i18n="size_orig"></span><small data-i18n="size_orig_hint"></small></span></label>
              <input type="radio" name="res" id="res-1080" value="1080"><label for="res-1080"><span><span data-i18n="size_1080"></span><small data-i18n="size_1080_hint"></small></span></label>
            </div>
          </div>
          <div class="group">
            <div class="lbl" data-i18n="ftype"></div>
            <div class="seg">
              <input type="radio" name="fmt" id="fmt-jpg" value="jpg" checked><label for="fmt-jpg"><span>JPEG<small data-i18n="jpeg_hint"></small></span></label>
              <input type="radio" name="fmt" id="fmt-png" value="png"><label for="fmt-png"><span>PNG<small data-i18n="png_hint"></small></span></label>
            </div>
          </div>
        </div>
      </details>

      <div class="tip" id="tip" hidden><b data-i18n="tip_title"></b><span data-i18n="tip_body"></span></div>
    </section>
  </main>

  <div class="bottom" id="bottom" hidden>
    <div class="progress" id="prog" hidden><i></i></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="btns">
      <button class="ghost" id="cancelBtn" data-i18n="cancel" hidden></button>
      <button class="big" id="goBtn"></button>
    </div>
  </div>
</div>

<input type="file" id="file" accept="image/*,video/*" multiple class="vh">

<div class="sheet" id="aiSheet" hidden>
  <div>
    <h2 data-i18n="ai_dl_title"></h2>
    <p data-i18n="ai_dl_body" style="margin:0;color:var(--muted)"></p>
    <div class="row2">
      <button class="ghost" id="aiNo" data-i18n="not_now"></button>
      <button class="big" id="aiYes" data-i18n="ai_dl_ok"></button>
    </div>
  </div>
</div>

<div class="sheet" id="iosSheet" hidden>
  <div>
    <h2 data-i18n="ios_title"></h2>
    <ol>
      <li data-i18n="ios1"></li>
      <li data-i18n="ios2"></li>
      <li data-i18n="ios3"></li>
    </ol>
    <button class="big" id="iosClose" data-i18n="got_it"></button>
  </div>
</div>

    c.width = c.height = 0; // free memory on phones
    if (!blob) throw new Error("err_large");
    return { blob, name: outName(it, p, jpg ? "jpg" : "png") };
  }

  function pickMime() {
    const list = ["video/mp4;codecs=avc1.640033,mp4a.40.2", "video/mp4;codecs=avc1.4d0033,mp4a.40.2", "video/mp4;codecs=avc1,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm"];
    return window.MediaRecorder ? list.find(m => MediaRecorder.isTypeSupported(m)) : null;
  }

  let wakeLock = null;
  async function keepAwake(on) {
    try {
      if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
      else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch (e) {}
  }

  async function convertVideo(it, onProgress, onStep) {
    const p = plan(it);
    if (p.untouched) return { blob: it.file, name: it.name };
    const mime = pickMime();
    if (!mime || !HTMLCanvasElement.prototype.captureStream) throw new Error("err_video_browser");
    const isMp4 = mime.startsWith("video/mp4");

    const host = document.createElement("div"); host.className = "vh"; document.body.append(host);
    let v = it._v;
    if (!v) { v = document.createElement("video"); v.playsInline = true; v.setAttribute("playsinline", ""); v.preload = "auto"; v.src = it.url; }
    host.append(v); v.pause();
    if (v.readyState < 2) await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error("err_video_read")); });
    v.currentTime = 0;

    const c = document.createElement("canvas"); c.width = p.W; c.height = p.H; host.append(c);
    const ctx = c.getContext("2d", { alpha: false });
    const pv = $("preview"), pctx = pv.getContext("2d");

    // AI keyframes: paint the edges at a few moments, then blend between them while recording
    let keys = null, K = 1;
    const box = placeBox(it.w, it.h, p.W, p.H);
    if (wantsAI(p)) {
      try {
        const dur0 = v.duration || it.duration || 1;
        const count = Math.max(2, Math.min(12, Math.ceil(dur0 / 2) + 1));
        K = dur0 / (count - 1); keys = [];
        for (let i = 0; i < count; i++) {
          if (cancelReq) break;
          await new Promise(r => { const tm = setTimeout(r, 3000); v.onseeked = () => { clearTimeout(tm); r(); }; v.currentTime = Math.min(dur0 - 0.05, i * K); });
          render(ctx, v, it.w, it.h, p.W, p.H);
          const ok = await aiFillCanvas(c, box, () => onStep(i + 1, count, "ai_video"));
          if (!ok) break;
          const kc = document.createElement("canvas"); kc.width = p.W; kc.height = p.H;
          kc.getContext("2d").drawImage(c, 0, 0); keys.push(kc);
          if (items[sel] === it) pctx.drawImage(c, 0, 0, pv.width, pv.height);
        }
        if (cancelReq) { host.remove(); return null; }
        await new Promise(r => { const tm = setTimeout(r, 3000); v.onseeked = () => { clearTimeout(tm); r(); }; v.currentTime = 0; });
      } catch (e) { aiBroken = true; aiErr = errText(e); keys = null; }
    }
    const draw = () => {
      if (keys && keys.length) {
        const pos = Math.min(keys.length - 1, v.currentTime / K), a = Math.floor(pos), b = Math.min(keys.length - 1, a + 1), f = pos - a;
        ctx.globalAlpha = 1; ctx.drawImage(keys[a], 0, 0);
        if (f > 0 && b !== a) { ctx.globalAlpha = f; ctx.drawImage(keys[b], 0, 0); ctx.globalAlpha = 1; }
        render2(c, v, it.w, it.h, box);
      } else render(ctx, v, it.w, it.h, p.W, p.H);
      if (items[sel] === it) pctx.drawImage(c, 0, 0, pv.width, pv.height);
    };
    draw();

    const stream = c.captureStream(60);
    if (it._dest) it._dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr)); else v.muted = true;

    const dur = v.duration || it.duration || 1;
    const srcBps = (it.file.size * 8) / dur;
    const vbps = Math.round(Math.min(60e6, Math.max(16e6, srcBps * 1.5 * Math.sqrt((p.W * p.H) / (it.w * it.h)))));
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: vbps, audioBitsPerSecond: 256000 });
    const chunks = []; rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise(r => { rec.onstop = r; });
    let ended = false;
    const finish = () => { if (ended) return; ended = true; setTimeout(() => { try { rec.stop(); } catch (e) {} }, 250); };
    v.onended = finish;
    const loop = () => {
      if (ended) return;
      if (cancelReq) { v.pause(); finish(); return; }
      draw(); onProgress(v.currentTime / dur, `${fmtTime(v.currentTime)} / ${fmtTime(dur)}`);
      v.requestVideoFrameCallback ? v.requestVideoFrameCallback(loop) : requestAnimationFrame(loop);
    };
    rec.start(1000);
    try { await v.play(); } catch (e) { finish(); await stopped; host.remove(); it._v = null; throw new Error("err_video_start"); }
    loop();
    await stopped;
    stream.getVideoTracks().forEach(tr => tr.stop());
    if (!cancelReq) it.preview = makePreview(c);
    host.remove();
    if (cancelReq) return null;
    const blob = new Blob(chunks, { type: isMp4 ? "video/mp4" : "video/webm" });
    if (!blob.size) throw new Error("err_video_empty");
    return { blob, name: outName(it, p, isMp4 ? "mp4" : "webm"), webm: !isMp4 };
  }

  let audioCtx = null;
  function primeVideos() { // must run synchronously inside the Convert tap
    try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) { audioCtx = null; }
    for (const it of items) {
      if (it.kind !== "video" || it.status === "done" || it._v) continue;
      const v = document.createElement("video");
      v.playsInline = true; v.setAttribute("playsinline", ""); v.preload = "auto"; v.src = it.url;
      if (audioCtx) { try { const node = audioCtx.createMediaElementSource(v); it._dest = audioCtx.createMediaStreamDestination(); node.connect(it._dest); } catch (e) { it._dest = null; } }
      const pr = v.play(); if (pr && pr.then) pr.then(() => { v.pause(); v.currentTime = 0; }).catch(() => {});
      it._v = v;
    }
  }

  async function convertAll() {
    if (busy) return;
    primeVideos();
    const needAI = items.some(i => i.status !== "done" && wantsAI(plan(i)));
    if (needAI && !aiSession && !(await modelIsCached()) && !(await askDownload())) { setStatus(S("ai_declined")); return; }
    busy = true; cancelReq = false; $("tip").hidden = true; updateButtons();
    $("prog").hidden = false;
    if (needAI && !aiSession) {
      try { await getSession((f) => { $("prog").firstElementChild.style.width = `${f * 100}%`; setStatus(S("ai_downloading", { p: Math.round(f * 100) })); }); }
      catch (e) { aiBroken = true; aiErr = errText(e); }
      $("prog").firstElementChild.style.width = "0";
    }
    const queue = items.filter(i => i.status !== "done");
    const hasVideo = queue.some(i => i.kind === "video");
    $("cancelBtn").hidden = !hasVideo; $("prog").hidden = false;
    if (hasVideo) keepAwake(true);
    let n = 0, webm = false;
    for (const it of queue) {
      if (cancelReq) break;
      n++; it.status = "working"; sel = items.indexOf(it); refresh();
      const k = n, total = queue.length;
      const prog = (f, fn) => { $("prog").firstElementChild.style.width = `${(((k - 1) + Math.min(1, f)) / total) * 100}%`; setStatus(() => (total > 1 ? t("file_of", { k, n: total }) : "") + fn()); };
      try {
        prog(0, S(it.kind === "video" ? "prep_video" : "prep_photo"));
        const step = (j, m, key) => prog(0, S(key || "ai_filling", { k: j, n: m }));
        const out = it.kind === "video" ? await convertVideo(it, (f, tm) => prog(f, S("encoding", { t: tm })), step) : await convertImage(it, step);
        if (!out) { it.status = "ready"; break; }
        it.out = out; it.status = "done"; if (out.webm) webm = true;
        if (it.kind === "video") { it._v = null; it._dest = null; }
      } catch (e) { it.status = "error"; it.err = I18N.en[e.message] ? e.message : "some_failed"; }
      prog(1, () => "");
      drawStrip();
    }
    keepAwake(false);
    busy = false; $("cancelBtn").hidden = true;
    setTimeout(() => { $("prog").hidden = true; $("prog").firstElementChild.style.width = "0"; }, 500);
    refresh();
    const errItem = items.find(i => i.status === "error");
    if (cancelReq) setStatus(S("canceled"));
    else if (errItem) setStatus(S(errItem.err), true);
    else if (webm) setStatus(S("webm_warn"), true);
    else if (aiBroken && opt("bg") === "ai" && !IN_CLAUDE) setStatus(() => t("ai_failed") + (aiErr ? ` [${aiErr}]` : ""), true);
    else setStatus(S("done_save"));
  }

  // ---------- Saving ----------
  let claudeDownloads = null; // available when opened inside the Claude app
  try { window.claude?.use?.("downloads").then(d => { claudeDownloads = d; }).catch(() => {}); } catch (e) {}

  function toFile(o) {
    if (o.blob instanceof File && o.blob.name === o.name) return o.blob;
    return new File([o.blob], o.name, { type: o.blob.type || (/\.png$/i.test(o.name) ? "image/png" : /\.mp4$/i.test(o.name) ? "video/mp4" : "image/jpeg") });
  }
  function afterSave(n) {
    setStatus(() => t("saved", { n }) + (isIOS ? " " + t("ios_save") : ""));
    $("tip").hidden = false;
    $("tip").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  async function saveAll() {
    const files = items.filter(i => i.status === "done" && i.out).map(i => toFile(i.out));
    if (!files.length) return;
    if (claudeDownloads) {
      let saved = 0;
      for (const f of files) {
        try { await claudeDownloads.save({ filename: f.name, data: f }); saved++; }
        catch (e) {
          if (e && e.code === "declined") { setStatus(saved ? S("saved_some", { n: saved }) : S("save_canceled")); if (saved) $("tip").hidden = false; return; }
          if (e && e.code === "rate_limited") { setStatus(S("prompt_open"), true); return; }
          setStatus(S("save_unavail"), true); return;
        }
      }
      afterSave(saved); return;
    }
    if (navigator.canShare && navigator.canShare({ files })) {
      try { await navigator.share({ files }); afterSave(files.length); return; }
      catch (e) { if (e.name === "AbortError") { setStatus(S("save_canceled")); return; } }
    }
    files.forEach((f, i) => setTimeout(() => {
      const a = document.createElement("a"), u = URL.createObjectURL(f);
      a.href = u; a.download = f.name; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 30000);
    }, i * 400));
    setStatus(S("downloading")); $("tip").hidden = false;
  }

  // ---------- Install ----------
  let deferredPrompt = null;
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; $("installBtn").hidden = false; });
  if (isIOS && !standalone) $("installBtn").hidden = false;
  $("installBtn").addEventListener("click", async () => {
    if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $("installBtn").hidden = true; }
    else $("iosSheet").hidden = false;
  });
  $("iosClose").addEventListener("click", () => { $("iosSheet").hidden = true; });
  window.addEventListener("appinstalled", () => { $("installBtn").hidden = true; });
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});

  // ---------- Wiring ----------
  $("langSel").innerHTML = LANGS.map(([c, n]) => `<option value="${c}">${n}</option>`).join("");
  $("langSel").addEventListener("change", (e) => { lang = e.target.value; store.set("uncrop-lang", lang); applyLang(); });
  $("pickFirst").addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", (e) => { const list = [...e.target.files]; e.target.value = ""; addFiles(list); });
  $("tryDemo").addEventListener("click", async () => addFiles([await makeDemo()]));
  $("removeBtn").addEventListener("click", removeSelected);
  $("goBtn").addEventListener("click", () => $("goBtn").dataset.mode === "save" ? saveAll() : convertAll());
  $("cancelBtn").addEventListener("click", () => { cancelReq = true; });
  document.querySelectorAll('input[name="bg"],input[name="res"],input[name="fmt"]').forEach(i => i.addEventListener("change", () => { updateAutoHint(); invalidate(); }));
  if (IN_CLAUDE) { $("bg-ai").disabled = true; $("aiNote").hidden = false; } else $("bg-ai").checked = true; // AI fill is the default in the installed app
  document.addEventListener("dragover", (e) => e.preventDefault());
  document.addEventListener("drop", (e) => { e.preventDefault(); addFiles([...e.dataTransfer.files]); });
  applyLang();
})();
</script>
</body>
</html>
